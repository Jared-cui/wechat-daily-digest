# ============================================================
# 微信公众号每日摘要流水线 · 配置模板
# 复制本文件为 config.yaml，填入你自己的值后运行。
# 在 GitHub Actions 中，密钥从 Secrets（环境变量）注入，无需填入本文件。
# ============================================================

# ---- 1. RSS 文章源（全部免费，无需任何付费服务）-------------------
# 采集窗口：前一日 08:40 ~ 当日 08:40（北京时间），见下方 settings.window_end
feeds:
  - name: "虎嗅APP"
    url: "https://rss.huxiu.com/"           # 虎嗅官方 RSS 专用域名（已验证可用）
    # 备用源（若主源挂掉，取消注释下行并注释上行）：
    # url: "https://rsshub.umzzz.com/huxiu/article"   # RSSHub 公共镜像
  - name: "36氪"
    url: "https://www.36kr.com/feed"        # 官方免费 RSS（必须带 www，裸域已被反爬 JS 挑战拦截）
  - name: "晚点LatePost"
    url: "https://rsshub.app/latepost"      # RSSHub 路由（UTC 时间自动转北京时间；本机网络可能超时，GitHub Actions 海外可用）
  - name: "钛媒体"
    url: "https://www.tmtpost.com/rss"      # 官方免费 RSS

# ---- 2. 大模型（AI 标题 + 论文式摘要 + 分类）---------------------
# 本地运行：填入真实 api_key；GitHub Actions：通过 DEEPSEEK_API_KEY 环境变量注入
llm:
  enabled: true
  base_url: "https://api.deepseek.com/v1"
  api_key: ""                        # 本地填真实 key；CI 留空（从环境变量读）
  model: "deepseek-chat"

# ---- 3. 推送渠道 --------------------------------------------------
wechat:
  type: email                # official（公众号客服消息） | wecom（企业微信） | email（SMTP 邮箱，推荐）

  # 公众号客服消息（type=official 时生效）
  appid: ""
  appsecret: ""
  openid: ""
  public_base_url: ""

  # 企业微信（type=wecom 时生效）
  wecom:
    mode: webhook
    webhook: ""                      # 本地填真实 webhook；CI 留空（从环境变量读）
    corpid: ""
    corpsecret: ""
    agentid: ""
    touser: "@all"

  # 邮箱推送（type=email 时生效，推荐）
  # ⚠️ password 是 SMTP 授权码（网易/QQ 邮箱开启 SMTP 后生成），不是登录密码
  # GitHub Actions 中通过 Secrets 注入：EMAIL_SMTP_HOST / EMAIL_SMTP_PORT / EMAIL_SENDER / EMAIL_PASSWORD / EMAIL_RECIPIENT
  email:
    smtp_host: "smtp.163.com"        # 网易163: smtp.163.com | QQ: smtp.qq.com
    smtp_port: 465
    use_ssl: true
    sender: ""                       # 发件邮箱（SMTP 账号）
    password: ""                     # SMTP 授权码
    recipient: ""                    # 收件邮箱
    subject_prefix: "📮 每日资讯 AI 精读"

# ---- 4. 运行参数 --------------------------------------------------
settings:
  window_end: "08:40"     # 采集窗口截止点（北京时间）：前一日 08:40 ~ 当日 08:40 的推送
  lookback_hours: 24       # 窗口跨度（小时），与 window_end 配合形成固定窗口
  max_articles: 30         # 单期最多收录篇数；超限时 AI 预筛选选出最重要 N 篇
