# 公众号每日摘要流水线 - GitHub Actions
# 每天北京时间 08:30 自动运行（UTC 00:30）
# 采集 RSS -> DeepSeek AI 阅读+分类 -> 生成 HTML -> 企业微信推送

name: 公众号每日摘要

on:
  schedule:
    # UTC 00:30 = 北京时间 08:30
    - cron: '30 0 * * *'
  # 支持手动触发（用于测试）
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成配置文件
        run: cp pipeline/config.example.yaml pipeline/config.yaml

      - name: 恢复去重缓存
        uses: actions/cache@v4
        with:
          path: pipeline/state.json
          key: digest-state-${{ github.run_id }}
          restore-keys: |
            digest-state-

      - name: 运行摘要流水线
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          DEEPSEEK_MODEL: deepseek-chat
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python pipeline/run_digest.py

      - name: 上传 HTML 日报（Artifact）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-html
          path: output/*.html
          retention-days: 30

      - name: 准备 GitHub Pages 文件
        if: always()
        run: |
          # 复制最新日报为 index.html（Pages 首页始终展示当天内容）
          ls output/digest_*.html 2>/dev/null | sort | tail -1 | xargs -I{} cp {} output/index.html
          # 生成归档索引页
          python pipeline/gen_index.py

      - name: 部署到 GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: output
          keep_files: true  # 保留历史日报，形成归档
